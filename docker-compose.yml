services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: fashionmate_db
    networks:
      - fashionmate-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` published -- only reachable from other containers on
    # fashionmate-internal, not from the host or outside the compose network.

  agent:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - claude-auth:/claude-auth
      - .:/workspace
    working_dir: /workspace
    networks:
      - fashionmate-internal
    stdin_open: true
    tty: true
    command: claude

networks:
  fashionmate-internal:
    driver: bridge

volumes:
  # Pinned to the un-namespaced name `claude-auth` on purpose. Without `name:`,
  # Compose prefixes the project name and mounts `unit-2-project-fashion-mate_claude-auth`
  # -- a *different*, empty volume from the `claude-auth` that `setup.md`'s
  # `docker run -v claude-auth:/claude-auth` populates with the OAuth credential.
  # That mismatch made every `docker compose run --rm agent claude -p ...` invocation
  # fail with "Not logged in - Please run /login" (see iteration-log Run 003).
  claude-auth:
    name: claude-auth
