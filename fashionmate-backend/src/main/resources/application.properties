# Enable Spring Boot debug logging
#debug=true
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/fashionmate_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Secrets are read from environment variables - never hardcode credentials here.
# Set DB_USERNAME, DB_PASSWORD, and GEMINI_API_KEY in your shell, IDE run config,
# or a local (gitignored) application-local.properties before running the app.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
gemini.api.key=${GEMINI_API_KEY}